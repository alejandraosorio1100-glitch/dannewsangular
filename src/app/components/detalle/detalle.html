<main class="contenedor-contacto">
  <div class="tarjeta-formulario" style="text-align: left; max-width: 700px;">
    <h2 id="titulo-detalle">{{ noticia?.titulo || 'Cargando noticia...' }}</h2>
    
    <img *ngIf="noticia" [src]="noticia.imagen" [alt]="noticia.titulo" 
         style="width: 100%; height: 280px; object-fit: cover; border-radius: 18px; margin-bottom: 20px;">
    
    <p style="font-size: 15px; line-height: 1.6; color: #444;">
      {{ noticia?.contenido || noticia?.resumen }}
    </p>
    
    <div style="margin-top: 30px;">
      <a routerLink="/noticias" class="btn-catalogo" style="display: inline-block;">← Volver a Noticias</a>
    </div>
  </div>
</main>
